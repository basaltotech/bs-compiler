[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "basalto"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.0",
    "numpy>=1.26",
]

[tool.maturin]
python-source = "python"
manifest-path = "python/Cargo.toml"
[tool.pyright]
reportMissingImports = "none"
