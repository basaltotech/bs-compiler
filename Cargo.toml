[workspace]
resolver = "2"
members = [
    "crates/basalto-common",
    "crates/basalto-core",
    "crates/basalto-gems",
    "crates/basalto-target-nvidia",
    "crates/basalto-target-amd",
    "crates/basalto-target-intel",
    "crates/basalto-tree",
    "crates/siliconforge-jit",
    "crates/energy-telemetry",
    "crates/basalto-installer",
    "python",
]

[workspace.dependencies]
pyo3 = "0.23.0"
redis = { version = "0.27.0", features = ["tokio-comp", "tokio-native-tls"] }
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
inkwell = "0.4.0"
blake3 = "1.5"
sha2 = "0.10"
dirs = "5.0"
libloading = "0.8"